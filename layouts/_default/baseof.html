<!doctype html>
<html lang="{{ .Language.Lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title><meta name="description" content="{{ .Description | default (.Summary | plainify) | default site.Params.description }}"><link rel="canonical" href="{{ .Permalink }}"><link rel="icon" href="/notebook/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/notebook/style.css"><link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="/index.xml"><meta property="og:title" content="{{ .Title }}"><meta property="og:description" content="{{ .Description | default (.Summary | plainify) | default site.Params.description }}"><meta property="og:url" content="{{ .Permalink }}"><meta property="og:type" content="{{ if eq .Section "posts" }}article{{ else }}website{{ end }}"><script defer src="/notebook/app.js"></script></head><body id="top">
<header><a class="brand" href="/"><span class="mark">s.</span> So I Write<span class="by"> / shelper</span></a><nav aria-label="Main navigation"><a href="/posts/">Posts</a><a href="/archives/">Archive</a><a href="/categories/">Categories</a><a href="/tags/">Tags</a><a href="/search/">Search <span aria-hidden="true">⌕</span></a><button id="theme" aria-label="Switch color theme">◐</button></nav></header>
{{ block "main" . }}{{ end }}
<footer><span>© {{ now.Year }} So I Write <span class="muted">— A notebook by shelper.</span></span><a href="https://github.com/shelper/shelper.github.io">Source ↗</a><a href="/index.xml">RSS ↗</a></footer></body></html>
